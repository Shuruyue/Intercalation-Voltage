name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows catches encoding problems Linux cannot (non-UTF-8 default file/console encoding)
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the exact versions the results were produced with
        run: |
          pip install -r requirements-lock.txt
          pip install --no-deps -e .
          pip install pytest ruff
      - name: Lint
        if: runner.os == 'Linux'
        run: ruff check .
      - name: Clean the snapshot and build the features; the committed cleaning output must not change
        run: python scripts/prep_data.py
      - name: Cleaning output is reproduced
        if: runner.os == 'Linux'
        run: git diff --exit-code data/clean.csv results/data_log.json
      - name: Unit tests and the page's data against the results (pytest)
        run: pytest -q
      - name: The page's JavaScript against Python, case by case (Node)
        run: node tests/web_model.test.js
      - name: Validation table (fails the job on any FAIL), figures
        run: |
          python scripts/validate.py --markdown
          python scripts/make_figures.py
      - name: VALIDATION.md is in sync with the code
        if: runner.os == 'Linux'
        run: git diff --exit-code VALIDATION.md
